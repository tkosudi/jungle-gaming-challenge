services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jungle}
      POSTGRES_USER: ${POSTGRES_USER:-jungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env (see .env.example)}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      # Lidos pelos placeholders de infra/keycloak/realm.json na importação do realm.
      PROVIDER_A_CLIENT_SECRET: ${PROVIDER_A_CLIENT_SECRET:?set it in .env}
      PROVIDER_B_CLIENT_SECRET: ${PROVIDER_B_CLIENT_SECRET:?set it in .env}
      INTERNAL_SERVICE_CLIENT_SECRET: ${INTERNAL_SERVICE_CLIENT_SECRET:?set it in .env}
      TEST_OTHER_AUDIENCE_CLIENT_SECRET: ${TEST_OTHER_AUDIENCE_CLIENT_SECRET:?set it in .env}
      TEST_SHORT_LIVED_CLIENT_SECRET: ${TEST_SHORT_LIVED_CLIENT_SECRET:?set it in .env}
      # Expõe /health/ready na porta de gerenciamento (9000, só dentro da rede do Compose).
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/jungle-realm.json:ro
    # Saudável depois do boot, que inclui a importação do realm. A imagem não tem curl/wget:
    # a requisição sai pelo /dev/tcp do bash.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "\"status\": \"UP\"" <&3
      interval: 5s
      timeout: 5s
      retries: 60

  localstack:
    image: localstack/localstack:4.6.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      DEBUG: "0"
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    # Saudável só depois que o script de init criou as filas (a última é a de eventos).
    healthcheck:
      test:
        - CMD-SHELL
        - awslocal sqs get-queue-url --queue-name wager-events.fifo >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-jungle}?sslmode=disable"
      OIDC_ISSUER_URL: "http://localhost:${KEYCLOAK_PORT:-8180}/realms/jungle"
      OIDC_JWKS_URL: "http://keycloak:8080/realms/jungle/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "wagering-api"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      SQS_TRUSTED_PROVIDERS: ${SQS_TRUSTED_PROVIDERS:?set SQS_TRUSTED_PROVIDERS in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 12
    # Acima do fx.StopTimeout (120s, ver internal/app): o processo termina o shutdown antes do SIGKILL.
    stop_grace_period: 130s

  # Ferramenta (não sobe com "docker compose up"): golang-migrate na rede do Compose.
  #   docker compose run --rm migrate up | down -all | version
  migrate:
    image: migrate/migrate:v4.20.1
    profiles:
      - tools
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-jungle}?sslmode=disable
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
